
name: Build Aflit Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci
        working-directory: aflit-frontend

      - name: Build React frontend
        run: npm run build
        working-directory: aflit-frontend

      - name: Sync Capacitor Android project
        run: npx cap sync android
        working-directory: aflit-frontend

      - name: Build debug APK
        run: |
          chmod +x aflit-frontend/android/gradlew
          cd aflit-frontend/android
          ./gradlew \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=1.0.${{ github.run_number }} \
            assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aflit-APK
          path: aflit-frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
